<html>
    <head>
        <title>ArchIdle Tests</title>
        <link href="./css/tests.css" rel="stylesheet" />
    </head>
    <body>
        <div>
            <button type="button" onclick="startHexTest();">Start hex test</button>
            <button type="button" onclick="resetCamera();">Reset camera</button>
            <button type="button" onclick="resetZoom();">Reset zoom</button>
        </div>
        <div>
            <label>
                Width:
                <input id="txtWidth" type="number" value="900" style="width: 50px;"><span style="color: gray;">px</span>
            </label>
            <label>
                Height:
                <input id="txtHeight" type="number" value="800" style="width: 50px;"><span style="color: gray;">px</span>
            </label>
            <label>
                Tile corner radius:
                <input id="txtRadius" type="number" value="29" style="width: 50px;"><span style="color: gray;">px</span>
            </label>
            <label>
                Tile horizontal spacing:
                <input id="txtSpacing" type="number" value="50" style="width: 50px;"><span style="color: gray;">px</span>
            </label>
            <label>
                Flattening:
                <input id="txtFlattening" type="number" value="0" style="width: 50px;"><span style="color: gray;">%</span>
            </label>
        </div>
        <div>
            <label>
                <input type="radio" name="labelType" value="coords" checked="checked">
                Show pixel coords
            </label>
            <label>
                <input type="radio" name="labelType" value="offset">
                Show offset x,y coords
            </label>
            <label>
                <input type="radio" name="labelType" value="axial">
                Show axial x,y coords
            </label>
            <label>
                <input type="radio" name="labelType" value="cube">
                Show cube x,y,z coords
            </label>
            <label>
                <input type="radio" name="labelType" value="double">
                Show doubled x,y coords
            </label>
            <label>
                <input type="radio" name="labelType" value="none">
                No labels
            </label>
        </div>
        <canvas id="canvas"></div>
        <script src="./js/tests.js"></script>
    </body>
</html>
